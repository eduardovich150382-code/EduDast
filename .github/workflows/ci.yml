name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Haqiqiy bazaga ulanmaydi — faqat `prisma generate` va build bosqichlari
  # uchun kerak (ular URL formatini tekshiradi, lekin ulanmaydi).
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
